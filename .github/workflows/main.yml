name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar RDP e Utilizador Seguro
      run: |
        # 1. Configurações de Servidor RDP e Firewall
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # 2. Desativar política de restrição de palavra-passe em branco / RDP NLA
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name "LimitBlankPasswordUse" -Value 0

        # 3. Criar utilizador dedicado 'rdpuser' com senha explicitamente definida
        cmd /c "net user rdpuser SenhaForte123! /add /expires:never"
        cmd /c "net localgroup Administrators rdpuser /add"
        cmd /c "net localgroup \"Remote Desktop Users\" rdpuser /add"

        # 4. Transfere e executa o Bore (Túnel TCP)
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "."

        Start-Process .\bore.exe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "C:\bore.log" -RedirectStandardError "C:\bore.err" -NoNewWindow

        Write-Host "A aguardar o link TCP do Bore..."
        Start-Sleep -Seconds 10

        Write-Host "=== ENDEREÇO RDP DIRETO ==="
        if (Test-Path "C:\bore.log") { Get-Content "C:\bore.log" }
        if (Test-Path "C:\bore.err") { Get-Content "C:\bore.err" }

        while ($true) { Start-Sleep -Seconds 30 }
