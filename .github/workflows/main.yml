name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin SenhaForte123!

    - name: Iniciar Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/b4Pvu3rtCDU/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
        
        # SUBSTISUÍ_AQUI O TEU TOKEN DO NGROK
        .\ngrok.exe config add-authtoken SEU_AUTHTOKEN_AQUI
        
        Start-Process .\ngrok.exe -ArgumentList "tcp 3389" -NoNewWindow
        Start-Sleep -Seconds 8
        
        $curl = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        Write-Host "=== ENDEREÇO RDP NGROK ==="
        Write-Host $curl.tunnels.public_url
        
        while ($true) { Start-Sleep -Seconds 30 }
