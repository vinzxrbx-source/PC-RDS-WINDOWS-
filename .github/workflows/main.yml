name: Windows RustDesk Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar e Iniciar RustDesk
      run: |
        # Criar diretório para o RustDesk
        New-Item -ItemType Directory -Force -Path "C:\rustdesk"
        Set-Location "C:\rustdesk"

        # Descarregar o RustDesk oficial para Windows
        Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-windows_x64.exe" -OutFile "rustdesk.exe"

        # Configurar pasta e palavra-passe fixa para acesso direto
        $configDir = "$env:APPDATA\RustDesk\config"
        if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Force -Path $configDir }
        
        @"
        [options]
        password = "SenhaForte123!"
        "@ | Out-File -FilePath "$configDir\rustdesk.toml" -Encoding utf8

        # Iniciar o RustDesk em segundo plano
        Start-Process .\rustdesk.exe -ArgumentList "--tray" -NoNewWindow
        Start-Sleep -Seconds 5

        # Obter o ID gerado para a conexão
        Write-Host "=== ID DO RUSTDESK ==="
        $rustdeskId = & .\rustdesk.exe --get-id
        Write-Host "O teu ID de acesso é: $rustdeskId"
        Write-Host "A palavra-passe é: SenhaForte123!"

        while ($true) { Start-Sleep -Seconds 30 }
