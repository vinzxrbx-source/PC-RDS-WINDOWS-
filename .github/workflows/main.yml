name: Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      pin:
        description: 'PIN de 6 dígitos para o acesso (ex: 123456)'
        required: true
        default: '123456'
      auth_code:
        description: 'Cole apenas o código do --code (ex: 4/0AX...)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Instalar e Configurar Chrome Remote Desktop
      run: |
        Write-Host "1. A instalar o Google Chrome via Chocolatey..."
        choco install googlechrome -y

        Write-Host "2. A descarregar o Chrome Remote Desktop diretamente do servidor da Google..."
        $crdMsi = "$env:TEMP\chromeremotedesktophost.msi"
        Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $crdMsi

        Write-Host "3. A instalar o Chrome Remote Desktop silenciosamente..."
        Start-Process msiexec.exe -ArgumentList "/i `"$crdMsi`" /quiet /norestart" -Wait

        Write-Host "4. A aguardar que os ficheiros fiquem prontos..."
        Start-Sleep -Seconds 10

        # Procura automática pelo executável
        $crdExe = Get-ChildItem -Path "C:\Program Files (x86)\Google\Chrome Remote Desktop", "C:\Program Files\Google\Chrome Remote Desktop" -Filter "remoting_start_host.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

        if (-not $crdExe) {
            Write-Error "O executável remoting_start_host.exe não foi encontrado!"
            exit 1
        }

        Write-Host "5. Encontrado em: $crdExe"
        Write-Host "6. A registar o host com a tua conta Google..."
        
        & $crdExe --code="${{ github.event.inputs.auth_code }}" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$Env:COMPUTERNAME" --pin="${{ github.event.inputs.pin }}"

        Write-Host "=== TUDO PRONTO! Podes aceder via app do Chrome Remote Desktop ==="

        while ($true) { Start-Sleep -Seconds 30 }
