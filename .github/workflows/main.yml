name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Habilitar RDP e Criar Utilizador
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin SenhaForte123!

    - name: Iniciar Tunel Pinggy e Capturar Link
      run: |
        # Redireciona stdout e stderr para o mesmo ficheiro log
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\pinggy.log" -RedirectStandardError "C:\pinggy.log" -NoNewWindow
        
        Write-Host "A aguardar a geracao do link do Pinggy..."
        for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path "C:\pinggy.log") {
                $content = Get-Content "C:\pinggy.log" -Raw -ErrorAction SilentlyContinue
                if ($content -match "tcp://") {
                    Write-Host "--- LINK ENCONTRADO ---"
                    Write-Host $content
                    exit 0
                }
            }
        }
        # Se passar o tempo, imprime o que tiver lá
        Get-Content "C:\pinggy.log" -ErrorAction SilentlyContinue
