name: Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      pin:
        description: 'PIN de 6 dígitos para o acesso (ex: 123456)'
        required: true
        default: '123456'
      auth_code:
        description: 'Cole apenas o código do --code (ex: 4/0AX...)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Instalar e Configurar Chrome Remote Desktop via Chocolatey
      run: |
        Write-Host "A instalar o gestor Chocolatey..."
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        $env:Path += ";$env:ALLUSERSPROFILE\chocolatey\bin"

        Write-Host "A instalar o Google Chrome e o Chrome Remote Desktop..."
        choco install googlechrome chrome-remote-desktop -y

        Write-Host "A registar o host com a tua conta Google..."
        & "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" --code="${{ github.event.inputs.auth_code }}" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$Env:COMPUTERNAME" --pin="${{ github.event.inputs.pin }}"

        Write-Host "=== TUDO PRONTO! Podes aceder via app do Chrome Remote Desktop ==="

        while ($true) { Start-Sleep -Seconds 30 }
