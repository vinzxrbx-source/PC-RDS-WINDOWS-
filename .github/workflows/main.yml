name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Habilitar RDP e Criar Utilizador
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin SenhaForte123!

    - name: Iniciar Tunel Pinggy e Capturar Link
      run: |
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\pinggy.txt" -RedirectStandardError "C:\pinggy.err" -NoNewWindow
        
        Write-Host "A aguardar a geracao do link do Pinggy..."
        for ($i=0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path "C:\pinggy.txt") {
                $content = Get-Content "C:\pinggy.txt" -ErrorAction SilentlyContinue
                if ($content) {
                    Write-Host $content
                }
            }
        }
