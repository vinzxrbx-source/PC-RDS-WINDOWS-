name: Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      pin:
        description: 'PIN de 6 dígitos para o acesso (ex: 123456)'
        required: true
        default: '123456'
      auth_code:
        description: 'Cole apenas o código do --code (ex: 4/0AX...)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Instalar e Configurar Chrome Remote Desktop
      run: |
        Write-Host "A descarregar o Google Chrome diretamente..."
        $chromeInstaller = "$env:TEMP\chrome_installer.exe"
        Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromeInstaller
        
        Write-Host "A instalar o Google Chrome silenciosamente..."
        Start-Process -FilePath $chromeInstaller -ArgumentList "/silent /install" -Wait

        Write-Host "A instalar o Chrome Remote Desktop via Winget..."
        winget install --id Google.ChromeRemoteDesktop -e --source winget --accept-source-agreements --accept-package-agreements

        Write-Host "A registar o host com a tua conta Google..."
        & "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" --code="${{ github.event.inputs.auth_code }}" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$Env:COMPUTERNAME" --pin="${{ github.event.inputs.pin }}"

        Write-Host "=== TUDO PRONTO! Podes aceder via app do Chrome Remote Desktop ==="

        while ($true) { Start-Sleep -Seconds 30 }
