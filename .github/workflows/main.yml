name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar RDP e Iniciar Bore
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin SenhaForte123!

        # Transferir o Bore (túnel TCP direto)
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "."

        # Iniciar o Bore apontando para a porta 3389 no servidor bore.pub
        Start-Process .\bore.exe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "C:\bore.log" -RedirectStandardError "C:\bore.err" -NoNewWindow

        Write-Host "A aguardar o link TCP do Bore..."
        Start-Sleep -Seconds 10

        Write-Host "=== O TEU ENDEREÇO RDP DIRETO ESTÁ AQUI ==="
        if (Test-Path "C:\bore.log") { Get-Content "C:\bore.log" }
        if (Test-Path "C:\bore.err") { Get-Content "C:\bore.err" }

        while ($true) { Start-Sleep -Seconds 30 }
