name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar RDP e Iniciar Serveo
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin SenhaForte123!

        # Inicia o Serveo em background sem precisar de PTY/Terminal
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 serveo.net" -RedirectStandardOutput "C:\serveo.out" -RedirectStandardError "C:\serveo.err" -NoNewWindow

        Write-Host "A aguardar a conexao com o Serveo..."
        Start-Sleep -Seconds 12

        Write-Host "=== TEU ENDERECO RDP ABAIXO ==="
        if (Test-Path "C:\serveo.err") { Get-Content "C:\serveo.err" }
        if (Test-Path "C:\serveo.out") { Get-Content "C:\serveo.out" }

        while ($true) { Start-Sleep -Seconds 30 }
