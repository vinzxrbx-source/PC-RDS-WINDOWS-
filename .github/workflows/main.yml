name: Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      pin:
        description: 'PIN de 6 dígitos para o acesso (ex: 123456)'
        required: true
        default: '123456'
      auth_code:
        description: 'Cole apenas o código do --code (ex: 4/0AX...)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Instalar e Configurar Chrome Remote Desktop
      run: |
        Write-Host "A instalar o gestor Chocolatey e o Google Chrome..."
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        $env:Path += ";$env:ALLUSERSPROFILE\chocolatey\bin"
        choco install googlechrome -y

        Write-Host "A instalar o Chrome Remote Desktop via Winget..."
        winget install --id Google.ChromeRemoteDesktop -e --accept-source-agreements --accept-package-agreements --silent

        Write-Host "A procurar o executável de registo..."
        Start-Sleep -Seconds 10
        
        # Procura automática do executável por todo o diretório do Google
        $crdExe = Get-ChildItem -Path "C:\Program Files (x86)\Google\Chrome Remote Desktop", "C:\Program Files\Google\Chrome Remote Desktop" -Filter "remoting_start_host.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

        if (-not $crdExe) {
            Write-Error "O executável remoting_start_host.exe não foi encontrado!"
            exit 1
        }

        Write-Host "Encontrado em: $crdExe"
        Write-Host "A registar o host com a tua conta Google..."
        
        & $crdExe --code="${{ github.event.inputs.auth_code }}" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$Env:COMPUTERNAME" --pin="${{ github.event.inputs.pin }}"

        Write-Host "=== TUDO PRONTO! Podes aceder via app do Chrome Remote Desktop ==="

        while ($true) { Start-Sleep -Seconds 30 }
