name: Windows RDP Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar RDP e Iniciar Tunel Pinggy
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin SenhaForte123!

        # Sem o -tt para o output cair diretamente no ficheiro de log
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\pinggy.out" -RedirectStandardError "C:\pinggy.err" -NoNewWindow

        Write-Host "A ligar o tunel, a aguardar 15 segundos..."
        Start-Sleep -Seconds 15

        Write-Host "=== O SEU LINK DO PINGGY ESTA AQUI ABAIXO ==="
        if (Test-Path "C:\pinggy.out") { Get-Content "C:\pinggy.out" }
        if (Test-Path "C:\pinggy.err") { Get-Content "C:\pinggy.err" }

        while ($true) { Start-Sleep -Seconds 30 }
